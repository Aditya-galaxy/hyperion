[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperion-guard"
version = "0.1.0"
description = "Pre-trade risk checks for autonomous trading agents, with the kill switch on Arc"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["eth-account>=0.13", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29", "pycryptodome>=3.20"]

[project.optional-dependencies]
test = ["pytest>=8"]
# for a hosted Guard that keeps its Solana state in Firestore
hosted = ["google-cloud-firestore>=2.16"]

[project.scripts]
hyperion-guard = "hyperion_guard.cli:main"

[tool.setuptools]
packages = ["hyperion_guard"]
