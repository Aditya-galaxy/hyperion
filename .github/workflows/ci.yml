name: Rust CI & Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Build & Run Test Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cargo Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Check code formatting
      run: cargo fmt --all -- --check || true

    - name: Cargo Check
      run: cargo check --verbose

    - name: Run Test Suite (13 tests)
      run: cargo test --verbose

    - name: Verify Release Build
      run: cargo build --release --verbose

  python_tests:
    name: Python Tests (event study)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install the package with test dependencies
      run: pip install "./python[test]"

    # Offline by design: notice parsing runs on saved real notices, price
    # arithmetic on hand-built series, the API on a hand-written database.
    # No test reaches Upbit or Binance.
    - name: Run Python tests
      run: pytest python/tests -q

  guard_contracts:
    name: Guard contracts (Foundry)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository (with contract libraries)
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Foundry
      uses: foundry-rs/foundry-toolchain@v1

    - name: Check formatting
      working-directory: guard/contracts
      run: forge fmt --check

    - name: Run contract tests
      working-directory: guard/contracts
      run: forge test -vv

  guard_service:
    name: Guard service (Python)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install the service with test dependencies
      run: pip install -e "guard/service[test]"

    # Offline: a fake chain and fixed prices. No test reaches Arc or Pyth.
    - name: Run service tests
      run: pytest guard/service/tests -q

  proof:
    name: Proof (Python)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install with test dependencies
      run: pip install -e "proof[test]"

    # Offline: a recorded Hyperliquid response and hand-built series.
    - name: Run tests
      run: pytest proof/tests -q

  solana_vault:
    name: Solana vault (SBF build + LiteSVM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guard/contracts_solana

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # rust-toolchain.toml in this folder selects the host toolchain the tests need.
    - name: Cache cargo, the SBF platform tools and the build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/
          ~/.cache/solana/
          guard/contracts_solana/target/
        key: ${{ runner.os }}-solana-vault-${{ hashFiles('guard/contracts_solana/Cargo.lock', 'guard/contracts_solana/rust-toolchain.toml') }}

    - name: Install cargo-build-sbf
      run: command -v cargo-build-sbf || cargo install --locked cargo-build-sbf

    - name: Build the program
      run: cargo build-sbf

    # Unit tests on the host, then the compiled program in LiteSVM.
    - name: Test
      run: cargo test

    # The Python client and the Guard against the compiled program: transactions
    # built in Python, co-signed by the Guard, executed in LiteSVM (solders).
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Guard + vault end to end
      working-directory: .
      run: |
        pip install -e "guard/service[test]" "solders==0.29.0"
        pytest guard/service/tests/test_solana_vault_e2e.py -q

  guard-client-ts:
    name: Guard client (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guard/client-ts

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Node runs the TypeScript tests directly (type stripping), so no build step.
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: guard/client-ts/package-lock.json

    - name: Install
      run: npm ci --no-audit --no-fund

    - name: Type-check
      run: npm run typecheck

    # Against test/vectors.json, which the Guard service's tests check is what Python produces.
    - name: Test
      run: npm test

    - name: Build
      run: npm run build
