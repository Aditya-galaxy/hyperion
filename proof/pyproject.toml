[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperion-proof"
version = "0.1.0"
description = "Verified track records for trading agents: reproducible metrics from public data, recorded in ERC-8004 on Arc"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["eth-account>=0.13", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
hyperion-proof = "hyperion_proof.cli:main"

[tool.setuptools]
packages = ["hyperion_proof"]
